# SLF4J SimpleLogger configuration

# Default logging level for all loggers
org.slf4j.simpleLogger.defaultLogLevel=info

# Show timestamps
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS

# Suppress noisy background polling / network timeout errors from TelegramBots library
org.slf4j.simpleLogger.log.org.telegram.telegrambots=off
org.slf4j.simpleLogger.log.okhttp3=off
